<title>おみくじ — OMIKUJI</title>

<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;700;800&family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ai:#0B1420; --gunjo:#16263C; --shu:#C8402F;
  --kin:#C9A24B; --washi:#F3ECDD; --sumi:#16151A;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:radial-gradient(120% 120% at 50% 40%, #0A1220 0%, #05080D 70%, #020407 100%);
  display:grid;place-items:center;overflow:hidden;
  font-family:'Zen Kaku Gothic New',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.stage{
  position:relative;
  width:min(100vw, calc(100vh * 16 / 9));
  aspect-ratio:16/9;cursor:pointer;outline:none;
  -webkit-tap-highlight-color:transparent;
  box-shadow:0 60px 140px -40px rgba(0,0,0,.9);
  user-select:none;
}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 120px 30px rgba(2,5,10,.55);}
.stage:focus-visible{outline:2px solid rgba(201,162,75,.85);outline-offset:-2px}
svg{display:block;width:100%;height:100%}
.title-ch{font-family:'Shippori Mincho B1',serif;font-weight:800;fill:var(--washi);letter-spacing:0}
.title-sub{font-family:'Zen Kaku Gothic New',sans-serif;fill:#8497AE;letter-spacing:.16em;font-size:17px}
#box{transform-box:view-box;transform-origin:1040px 740px;will-change:transform}
.stage.shaking #box{animation:shake 1.05s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{
  0%{transform:translate(0,0) rotate(0deg)} 7%{transform:translate(-9px,-3px) rotate(-2.2deg)}
  14%{transform:translate(11px,1px) rotate(2.4deg)} 21%{transform:translate(-13px,-1px) rotate(-2.6deg)}
  29%{transform:translate(13px,-3px) rotate(2.7deg)} 37%{transform:translate(-10px,2px) rotate(-2.1deg)}
  45%{transform:translate(11px,-1px) rotate(2.2deg)} 53%{transform:translate(-8px,0) rotate(-1.6deg)}
  62%{transform:translate(8px,-1px) rotate(1.7deg)} 71%{transform:translate(-5px,1px) rotate(-1deg)}
  80%{transform:translate(5px,0) rotate(.9deg)} 89%{transform:translate(-2px,0) rotate(-.4deg)}
  100%{transform:translate(0,0) rotate(0deg)}
}
#sticks{transform-box:view-box;transform-origin:1040px 505px}
.stage.shaking #sticks{animation:rattle .09s steps(2,end) infinite alternate}
@keyframes rattle{from{transform:translate(0,0) rotate(-.8deg)} to{transform:translate(0,-7px) rotate(.9deg)}}
#slipTip{opacity:0;transform:translateY(40px);transition:transform .34s cubic-bezier(.2,1.5,.35,1),opacity .18s ease}
.stage.tipping #slipTip{opacity:1;transform:translateY(-58px)}
#lanternGlow{animation:flicker 5.5s ease-in-out infinite}
@keyframes flicker{
  0%,100%{opacity:.85;transform:scale(1)} 22%{opacity:.68;transform:scale(.96)}
  47%{opacity:.95;transform:scale(1.03)} 71%{opacity:.74;transform:scale(.98)}
}
.dust{animation:drift linear infinite}
@keyframes drift{
  0%{transform:translate(0,0);opacity:0} 15%{opacity:.9}
  85%{opacity:.7} 100%{transform:translate(var(--dx,10px),-120px);opacity:0}
}
#dimmer{transition:opacity .55s ease}
.stage.revealed #dimmer{opacity:.52}
#paper{
  opacity:0;transform-box:view-box;transform-origin:790px 455px;
  transform:translate(250px,28px) scale(.05) rotate(7deg);
  transition:transform .6s cubic-bezier(.5,0,.75,0), opacity .3s ease;
  will-change:transform,opacity;
}
.stage.revealed #paper{opacity:1;animation:fly .98s cubic-bezier(.18,.9,.28,1) both}
@keyframes fly{
  0%{transform:translate(250px,28px) scale(.05) rotate(8deg);opacity:0}
  16%{opacity:1}
  42%{transform:translate(162px,-104px) scale(.30) rotate(-5deg)}
  68%{transform:translate(46px,-28px) scale(.84) rotate(2deg)}
  86%{transform:translate(-6px,4px) scale(1.015) rotate(-.4deg)}
  100%{transform:translate(0,0) scale(1) rotate(0deg);opacity:1}
}
.ri{opacity:0;transform:translateY(14px);transform-box:fill-box;transform-origin:center;
  transition:opacity .45s ease,transform .6s cubic-bezier(.16,1,.3,1);transition-delay:0s}
.stage.revealed .ri{opacity:1;transform:none;transition-delay:var(--d,.95s)}
#pStamp{transform-box:fill-box;transform-origin:center;transform:scale(1.35) rotate(-8deg);opacity:0;
  transition:transform .5s cubic-bezier(.2,1.6,.3,1),opacity .3s ease}
.stage.revealed #pStamp{transform:scale(1) rotate(-3deg);opacity:1;transition-delay:1.5s}
#cta{cursor:pointer}
#ctaDot{animation:blink 2.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1} 50%{opacity:.25}}
#ctaText{font-family:'Zen Kaku Gothic New',sans-serif;font-size:22px;fill:var(--washi);letter-spacing:.06em}
#mute{cursor:pointer;opacity:.5;transition:opacity .2s ease}
#mute:hover{opacity:.9}
.muted #muteWave{opacity:0}
@media (prefers-reduced-motion: reduce){
  .stage.shaking #box{animation-duration:.4s}
  .stage.shaking #sticks{animation:none}
  #lanternGlow{animation:none}
}
</style>
</head>

      <circle r="21" fill="#F3ECDD" fill-opacity=".05" stroke="#C9A24B" stroke-opacity=".35"/>
      <path d="M-7,-4 L-3,-4 L2,-8 L2,8 L-3,4 L-7,4 Z" fill="#D9CFB8"/>
      <g id="muteWave" stroke="#D9CFB8" stroke-width="1.6" fill="none" stroke-linecap="round">
        <path d="M5,-4 Q8,0 5,4"/><path d="M8,-7 Q13,0 8,7"/>
      </g>
      <path id="muteSlash" d="M-8,-8 L9,9" stroke="#D8492F" stroke-width="2" stroke-linecap="round" opacity="0"/>
    </g>
  </svg>
</div>

<script>
/* omikuji CLI から埋め込まれた固定の運勢を表示する */
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const stage = document.getElementById('stage');
  const sticksG = document.getElementById('sticks');
  const ctaText = document.getElementById('ctaText');

  const FORTUNE = {
    rank: "小吉",
    lead: "小さな決断が、のちに効いてくる。",
    wish: "ひとつに絞ると吉",
    wait: "気を許せる相手と",
    trip: "日帰りがちょうどいい"
  };

  function buildSticks(){
    sticksG.innerHTML = '';
    const n = 13;
    for (let i = 0; i < n; i++){
      const t = i / (n - 1);
      const ang = -22 + t * 44 + (Math.random() * 7 - 3.5);
      const x = 1040 + (t - .5) * 82 + (Math.random() * 7 - 3.5);
      const h = 44 + Math.random() * 52;
      const g = document.createElementNS(NS, 'g');
      g.setAttribute('transform', `translate(${x.toFixed(1)} 494) rotate(${ang.toFixed(1)})`);
      const r = document.createElementNS(NS, 'rect');
      r.setAttribute('x', -7); r.setAttribute('y', -h);
      r.setAttribute('width', 14); r.setAttribute('height', h + 26);
      r.setAttribute('rx', 7); r.setAttribute('fill', '#E9DBBE');
      r.setAttribute('opacity', (0.86 + Math.random()*0.14).toFixed(2));
      g.appendChild(r);
      if (i % 4 === 0){
        const band = document.createElementNS(NS, 'rect');
        band.setAttribute('x', -7); band.setAttribute('y', -h + 8);
        band.setAttribute('width', 14); band.setAttribute('height', 8);
        band.setAttribute('fill', '#C8402F'); band.setAttribute('opacity', '.8');
        g.appendChild(band);
      }
      sticksG.appendChild(g);
    }
  }

  function buildSky(){
    const stars = document.getElementById('stars');
    for (let i = 0; i < 44; i++){
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', (Math.random() * 1600).toFixed(0));
      c.setAttribute('cy', (Math.random() * 520).toFixed(0));
      c.setAttribute('r', (Math.random() * 1.6 + .4).toFixed(2));
      c.setAttribute('fill', '#DCE6F2');
      c.setAttribute('opacity', (Math.random() * .6 + .15).toFixed(2));
      stars.appendChild(c);
    }
    const dust = document.getElementById('dustLayer');
    for (let i = 0; i < 26; i++){
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', (Math.random() * 1600).toFixed(0));
      c.setAttribute('cy', (500 + Math.random() * 380).toFixed(0));
      c.setAttribute('r', (Math.random() * 2.2 + .8).toFixed(2));
      c.setAttribute('fill', Math.random() > .55 ? '#F2C889' : '#C8D4E2');
      c.setAttribute('class', 'dust');
      c.style.setProperty('--dx', (Math.random() * 80 - 40).toFixed(0) + 'px');
      c.style.animationDuration = (7 + Math.random() * 9).toFixed(1) + 's';
      c.style.animationDelay = (-Math.random() * 12).toFixed(1) + 's';
      dust.appendChild(c);
    }
  }

  /* ---------- 音 ---------- */
  let ac = null, nb = null, muted = false;
  function ensureAudio(){
    if (!ac){
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }
      const len = Math.floor(ac.sampleRate * .5);
      nb = ac.createBuffer(1, len, ac.sampleRate);
      const d = nb.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
  }
  function clack(when, vol, freq){
    if (!ac || muted) return;
    const s = ac.createBufferSource(); s.buffer = nb;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.value = freq; bp.Q.value = 1.1;
    const g = ac.createGain();
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(vol, when + .004);
    g.gain.exponentialRampToValueAtTime(.0008, when + .085);
    s.connect(bp).connect(g).connect(ac.destination);
    s.start(when); s.stop(when + .12);
  }
  const sfx = {
    rattle(){
      ensureAudio(); if (!ac) return;
      const t = ac.currentTime;
      for (let i = 0; i < 17; i++){
        clack(t + i * .052 + Math.random() * .028, .06 + Math.random() * .05, 780 + Math.random() * 900);
      }
    },
    paper(){
      ensureAudio(); if (!ac || muted) return;
      const t = ac.currentTime;
      const s = ac.createBufferSource(); s.buffer = nb;
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = .8;
      bp.frequency.setValueAtTime(2600, t);
      bp.frequency.exponentialRampToValueAtTime(700, t + .4);
      const g = ac.createGain();
      g.gain.setValueAtTime(.0001, t);
      g.gain.linearRampToValueAtTime(.05, t + .05);
      g.gain.exponentialRampToValueAtTime(.0005, t + .42);
      s.connect(bp).connect(g).connect(ac.destination);
      s.start(t); s.stop(t + .45);
    },
    chime(){
      ensureAudio(); if (!ac || muted) return;
      const t = ac.currentTime;
      [880, 1320, 1760].forEach((f, i) => {
        const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = f;
        const g = ac.createGain();
        g.gain.setValueAtTime(0, t + i * .06);
        g.gain.linearRampToValueAtTime(.045 / (i + 1), t + i * .06 + .02);
        g.gain.exponentialRampToValueAtTime(.0004, t + i * .06 + 1.4);
        o.connect(g).connect(ac.destination);
        o.start(t + i * .06); o.stop(t + i * .06 + 1.5);
      });
    }
  };

  function setFortune(f){
    const [a, b] = Array.from(f.rank);
    document.getElementById('pR1').textContent = a || '';
    document.getElementById('pR2').textContent = b || '';
    document.getElementById('pLead').textContent = f.lead;
    document.getElementById('pWish').textContent = f.wish;
    document.getElementById('pWait').textContent = f.wait;
    document.getElementById('pTrip').textContent = f.trip;
    const d = new Date();
    document.getElementById('pDate').textContent = '引いた日 ' + d.getFullYear() + '.' +
      String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');
  }

  const wait = ms => new Promise(r => setTimeout(r, ms));
  let busy = false;

  async function draw(){
    if (busy) return;
    busy = true;
    setFortune(FORTUNE);
    stage.classList.remove('revealed', 'tipping');
    stage.classList.add('shaking');
    ctaText.textContent = '…';
    buildSticks();
    sfx.rattle();
    await wait(800);
    stage.classList.add('tipping');
    sfx.paper();
    await wait(300);
    stage.classList.remove('shaking', 'tipping');
    stage.classList.add('revealed');
    sfx.chime();
    ctaText.textContent = 'もう一度見る';
    await wait(400);
    busy = false;
  }

  stage.addEventListener('click', e => {
    if (e.target.closest('#mute')) return;
    ensureAudio();
    draw();
  });
  stage.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); ensureAudio(); draw(); }
  });

  const mute = document.getElementById('mute');
  mute.addEventListener('click', e => {
    e.stopPropagation();
    muted = !muted;
    stage.classList.toggle('muted', muted);
    document.getElementById('muteSlash').setAttribute('opacity', muted ? '1' : '0');
    if (!muted){ ensureAudio(); }
  });

  buildSky();
  buildSticks();
  setFortune(FORTUNE);
})();
</script>

</body>
</html>
